# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build Metal library
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
    
        METAL_DIR="Tests/MetalFunctionTests/Resources"
        BUILD_DIR=".build/metal"
    
        mkdir -p "$BUILD_DIR"
    
        air_files=()
    
        for source in "$METAL_DIR"/*.metal; do
          name="$(basename "${source%.metal}")"
          output="$BUILD_DIR/$name.air"
    
          xcrun -sdk macosx metal \
            -c "$source" \
            -o "$output"
    
          air_files+=("$output")
        done
    
        if (( ${#air_files[@]} == 0 )); then
          echo "No .metal files found in $METAL_DIR"
          exit 1
        fi
    
        xcrun -sdk macosx metallib \
          "${air_files[@]}" \
          -o "$METAL_DIR/default.metallib"
          
    - name: Build
      run: swift build -v
      
    - name: Run tests
      run: swift test -v
